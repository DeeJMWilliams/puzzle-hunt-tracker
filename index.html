<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Zeta - Hunt Tracker</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="password-gate">
        <div class="password-box">
            <h2>Puzzle Hunt Tracker</h2>
            <p>Enter password to continue</p>
            <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
            <button id="password-submit">Enter</button>
            <p id="password-error">Incorrect password</p>
        </div>
    </div>

    <div class="container" id="main-content" style="display:none">
        <header>
            <h1>Puzzle Hunt Progress Tracker</h1>
        </header>

        <div class="main-content">
            <!-- Map Section -->
            <section class="map-section">
                <h2>Location Map</h2>
                <div class="map-container">
                    <div class="map-sidebar">
                        <div class="filter-group">
                            <h4>Confidence</h4>
                            <label><input type="checkbox" id="filter-high" checked> High (90%+)</label>
                            <label><input type="checkbox" id="filter-medium" checked> Med (50-89%)</label>
                            <label><input type="checkbox" id="filter-low" checked> Low (1-49%)</label>
                        </div>
                        <div class="filter-group">
                            <label class="stage-toggle-label">
                                <input type="checkbox" id="filter-stage1" checked>
                                <strong>Stage 1</strong>
                            </label>
                            <div id="section-filters-stage1" class="section-filter-list"></div>
                        </div>
                        <div class="filter-group">
                            <label class="stage-toggle-label">
                                <input type="checkbox" id="filter-stage2" checked>
                                <strong>Stage 2</strong>
                            </label>
                            <div id="section-filters-stage2" class="section-filter-list"></div>
                        </div>
                        <div class="filter-group">
                            <h4>Overlays</h4>
                            <label><input type="checkbox" id="toggle-stage2-path"> Stage 2 path (A→Z)</label>
                        </div>
                    </div>
                    <div id="map"></div>
                </div>
            </section>

            <!-- Puzzles List Section -->
            <section class="puzzles-section">
                <h2>Puzzles</h2>
                <div class="puzzles-container">
                    <nav class="toc-sidebar" id="toc-sidebar"></nav>
                    <div id="puzzles-list"></div>
                </div>
            </section>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
